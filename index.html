<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard équipe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface2: #f1efea;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --text: #1a1a18;
      --text2: #5f5e5a;
      --text3: #888780;
      --radius-md: 8px;
      --radius-lg: 12px;
      --blue: #185fa5; --blue-bg: #E6F1FB;
      --purple: #534AB7; --purple-bg: #EEEDFE;
      --green: #3B6d11; --green-bg: #EAF3DE;
      --amber: #854f0b; --amber-bg: #FAEEDA;
      --pink: #993356; --pink-bg: #FBEAF0;
      --gray: #5f5e5a; --gray-bg: #F1EFE8;
      --red: #a32d2d; --red-bg: #FCEBEB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --surface: #252523; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
        --text: #e8e6df; --text2: #a8a69f; --text3: #6e6c66;
        --blue-bg: #0c447c; --blue: #85b7eb;
        --purple-bg: #3c3489; --purple: #afa9ec;
        --green-bg: #27500a; --green: #97c459;
        --amber-bg: #633806; --amber: #ef9f27;
        --pink-bg: #72243e; --pink: #ed93b1;
        --gray-bg: #444441; --gray: #b4b2a9;
        --red-bg: #501313; --red: #f09595;
      }
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

    .app { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
    .topbar h1 { font-size: 20px; font-weight: 500; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .date-label { font-size: 13px; color: var(--text2); }

    .grid3-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .grid-main { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 900px) {
      .grid3-metrics { grid-template-columns: repeat(3,1fr); }
      .grid3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .grid3-metrics { grid-template-columns: repeat(3,1fr); }
    }

    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
    .metric { background: var(--surface2); border-radius: var(--radius-md); padding: 1rem; text-align: center; }
    .metric .lbl { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
    .metric .val { font-size: 26px; font-weight: 500; color: var(--text); }
    .section-title { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }

    button { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius-md); color: var(--text); padding: 6px 14px; font-size: 13px; cursor: pointer; transition: background .15s, transform .1s; }
    button:hover { background: var(--surface2); }
    button:active { transform: scale(0.97); }
    button.primary { background: var(--blue-bg); border-color: transparent; color: var(--blue); font-weight: 500; }
    button.danger { background: var(--red-bg); border-color: transparent; color: var(--red); font-weight: 500; }
    input, select, textarea { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-md); color: var(--text); padding: 6px 10px; font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--border2); }

    .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }

    /* ── Kanban ── */
    .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 600px) { .kanban { grid-template-columns: 1fr; } }
    .col-title { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .task-card { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; transition: border-color .15s; position: relative; }
    .task-card:hover { border-color: var(--border2); }
    .task-card-top { display: flex; align-items: flex-start; gap: 8px; }
    .task-check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; background: var(--surface); transition: background .15s, border-color .15s; }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked::after { content: '✓'; font-size: 10px; color: white; }
    .task-card-title { font-size: 13px; font-weight: 500; cursor: pointer; flex: 1; color: var(--text); }
    .task-card-title:hover { color: var(--blue); }
    .task-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-left: 24px; }
    .task-del { background: none; border: none; color: var(--text3); font-size: 15px; padding: 0 2px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s, color .15s; }
    .task-card:hover .task-del { opacity: 1; }
    .task-del:hover { color: var(--red); background: none; transform: none; }
    .task-actions { display: flex; align-items: center; gap: 6px; }
    .cycle-btn { font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; border: 0.5px solid var(--border); background: var(--surface); color: var(--text2); }
    .cycle-btn:hover { background: var(--surface2); }

    .add-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .add-row input { flex: 2; min-width: 120px; }
    .add-row select { flex: 1; min-width: 80px; }
    .bulk-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--text2); }

    /* ── Agenda ── */
    .agenda-item { display: flex; gap: 12px; padding: 8px 0; border-bottom: 0.5px solid var(--border); align-items: flex-start; }
    .agenda-item:last-child { border-bottom: none; }
    .agenda-time { font-size: 12px; color: var(--text2); min-width: 44px; padding-top: 2px; }
    .agenda-body { flex: 1; }
    .agenda-title { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
    .agenda-tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .agenda-del { background: none; border: none; color: var(--text3); font-size: 15px; padding: 0 2px; cursor: pointer; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
    .agenda-item:hover .agenda-del { opacity: 1; }
    .agenda-del:hover { color: var(--red); background: none; transform: none; }
    .agenda-add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .agenda-add input[type="time"] { width: 90px; }
    .agenda-add input[type="text"] { flex: 1; min-width: 100px; }

    /* ── KPIs ── */
    .kpi-row { display: flex; align-items: center; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
    .kpi-row:last-child { border-bottom: none; }
    .kpi-label { font-size: 13px; min-width: 110px; }
    .kpi-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; margin: 0 10px; }
    .kpi-bar { height: 6px; border-radius: 3px; transition: width .4s; }
    .kpi-val { font-size: 13px; font-weight: 500; min-width: 36px; text-align: right; }

    /* ── Annonces ── */
    .msg { display: flex; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
    .msg:last-child { border-bottom: none; }
    .msg-body { flex: 1; min-width: 0; }
    .msg-author { font-size: 12px; font-weight: 500; }
    .msg-text { font-size: 13px; color: var(--text2); margin-top: 2px; word-break: break-word; }
    .msg-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .announce-add { display: flex; gap: 8px; margin-top: 10px; }
    .announce-add input { flex: 1; }

    /* ── Modal générique ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s; padding: 1rem; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 1.5rem; width: 460px; max-width: 100%; max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform .2s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h2 { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
    .field { margin-bottom: 10px; }
    .field label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; }
    .field textarea { resize: vertical; min-height: 80px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }

    /* ── Modal tâche ── */
    .task-detail-section { margin-top: 14px; }
    .task-detail-section h3 { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
    .done-list { list-style: none; }
    .done-list li { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; color: var(--text2); }
    .done-list li:last-child { border-bottom: none; }
    .done-list li::before { content: '✓'; color: var(--green); font-size: 12px; margin-top: 1px; flex-shrink: 0; }
    .done-add { display: flex; gap: 8px; margin-top: 8px; }
    .done-add input { flex: 1; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 10px; font-weight: 500; }

    /* ── Membres modal ── */
    .member-list-modal { margin-bottom: 1rem; }
    .member-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
    .member-row:last-child { border-bottom: none; }
    .member-row span { flex: 1; font-size: 13px; }
    .member-row .role { font-size: 12px; color: var(--text2); }
    .del-btn { background: none; border: none; color: var(--text3); font-size: 16px; padding: 0 6px; cursor: pointer; }
    .del-btn:hover { color: var(--red); background: none; }

    .color-opts { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color .15s; }
    .color-opt.selected { border-color: var(--text); }

    .sep { border: none; border-top: 0.5px solid var(--border); margin: 1rem 0; }
  </style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <h1>Dashboard équipe</h1>
    <div class="topbar-right">
      <span class="date-label" id="today-date"></span>
      <button onclick="openMembersModal()">+ Collaborateurs</button>
    </div>
  </div>

  <!-- Métriques -->
  <div class="grid3-metrics" style="margin-bottom:14px">
    <div class="metric"><div class="lbl">Tâches terminées</div><div class="val" id="m-done">0</div></div>
    <div class="metric"><div class="lbl">En cours</div><div class="val" id="m-prog">0</div></div>
    <div class="metric"><div class="lbl">Avancement</div><div class="val" id="m-pct">0%</div></div>
  </div>

  <!-- Kanban (pleine largeur) -->
  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="section-title" style="margin-bottom:0">Tâches &amp; statuts</div>
      <div id="bulk-bar" style="display:none" class="bulk-bar">
        <span id="sel-count">0 sélectionnée(s)</span>
        <button class="danger" onclick="deleteSelected()">Supprimer la sélection</button>
        <button onclick="clearSelection()">Annuler</button>
      </div>
    </div>
    <div class="kanban">
      <div>
        <div class="col-title"><span class="col-dot" style="background:var(--gray)"></span>À faire <span id="cnt-todo"></span></div>
        <div id="col-todo"></div>
      </div>
      <div>
        <div class="col-title"><span class="col-dot" style="background:var(--blue)"></span>En cours <span id="cnt-prog"></span></div>
        <div id="col-prog"></div>
      </div>
      <div>
        <div class="col-title"><span class="col-dot" style="background:var(--green)"></span>Terminé <span id="cnt-done"></span></div>
        <div id="col-done"></div>
      </div>
    </div>
    <div class="add-row">
      <input id="new-task-title" placeholder="Titre de la tâche..." />
      <select id="new-task-member"></select>
      <select id="new-task-tag">
        <option>Dev</option><option>Design</option>
        <option>Marketing</option><option>Admin</option><option>Autre</option>
      </select>
      <button class="primary" onclick="addTask()">+ Ajouter</button>
    </div>
  </div>

  <!-- Agenda + KPIs + Annonces -->
  <div class="grid3">
    <div class="card">
      <div class="section-title">Agenda du jour</div>
      <div id="agenda-list"></div>
      <div class="agenda-add">
        <input type="time" id="new-event-time" value="09:00" />
        <input type="text" id="new-event-title" placeholder="Événement..." />
        <button onclick="addEvent()">+</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">KPIs</div>
      <div id="kpi-list"></div>
    </div>
    <div class="card">
      <div class="section-title">Annonces</div>
      <div id="announce-list"></div>
      <div class="announce-add">
        <input id="new-announce" placeholder="Écrire une annonce..." />
        <button onclick="postAnnounce()">Publier</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ Modal : Détail tâche ═══ -->
<div class="modal-overlay" id="task-modal-overlay" onclick="closeTaskModalOnBg(event)">
  <div class="modal" style="width:520px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:1rem">
      <h2 id="tm-title" style="flex:1;word-break:break-word"></h2>
      <span id="tm-status-badge" class="status-badge"></span>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap">
      <div id="tm-avatar" class="avatar"></div>
      <span id="tm-member-name" style="font-size:13px;color:var(--text2)"></span>
      <span id="tm-tag" class="tag"></span>
    </div>

    <div class="field">
      <label>Description — ce que je dois faire</label>
      <textarea id="tm-desc" placeholder="Décrivez ce qui doit être accompli..."></textarea>
    </div>

    <div class="task-detail-section">
      <h3>Ce qui a été réalisé</h3>
      <ul class="done-list" id="tm-done-list"></ul>
      <div class="done-add">
        <input id="tm-done-input" placeholder="Ajouter une réalisation..." />
        <button onclick="addDoneItem()">+</button>
      </div>
    </div>

    <div class="task-detail-section">
      <h3>Avancer le statut</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        <button onclick="setTaskStatus('todo')">À faire</button>
        <button onclick="setTaskStatus('prog')">En cours</button>
        <button onclick="setTaskStatus('done')">Terminé</button>
      </div>
    </div>

    <div class="modal-footer">
      <button class="danger" onclick="deleteTaskFromModal()">Supprimer</button>
      <button onclick="saveTaskModal()">Sauvegarder</button>
      <button class="primary" onclick="closeTaskModal()">Fermer</button>
    </div>
  </div>
</div>

<!-- ═══ Modal : Collaborateurs ═══ -->
<div class="modal-overlay" id="members-modal-overlay" onclick="closeMembersModalOnBg(event)">
  <div class="modal">
    <h2>Gérer les collaborateurs</h2>
    <div class="member-list-modal" id="member-list"></div>
    <hr class="sep"/>
    <div style="font-size:13px;font-weight:500;margin-bottom:10px;color:var(--text2)">Ajouter un collaborateur</div>
    <div class="field"><label>Prénom</label><input id="m-name" placeholder="ex: Sophie" /></div>
    <div class="field"><label>Rôle</label><input id="m-role" placeholder="ex: Designer" /></div>
    <div class="field">
      <label>Couleur</label>
      <div class="color-opts" id="color-opts"></div>
    </div>
    <div class="modal-footer">
      <button onclick="closeMembersModal()">Fermer</button>
      <button class="primary" onclick="addMember()">Ajouter</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  PALETTES & CONFIG
// ═══════════════════════════════════════════
const PALETTES = [
  {color:'#185fa5',bg:'#E6F1FB'},{color:'#534AB7',bg:'#EEEDFE'},
  {color:'#3B6d11',bg:'#EAF3DE'},{color:'#854f0b',bg:'#FAEEDA'},
  {color:'#993356',bg:'#FBEAF0'},{color:'#5f5e5a',bg:'#F1EFE8'},
  {color:'#0F6E56',bg:'#E1F5EE'},{color:'#993C1D',bg:'#FAECE7'},
];
const TAG_STYLES = {
  Dev:{color:'#185fa5',bg:'#E6F1FB'}, Design:{color:'#534AB7',bg:'#EEEDFE'},
  Marketing:{color:'#3B6d11',bg:'#EAF3DE'}, Admin:{color:'#854f0b',bg:'#FAEEDA'},
  Réunion:{color:'#185fa5',bg:'#E6F1FB'}, Autre:{color:'#5f5e5a',bg:'#F1EFE8'},
};
const STATUS_LABELS = {todo:'À faire',prog:'En cours',done:'Terminé'};
const STATUS_COLORS = {
  todo:{color:'var(--gray)',bg:'var(--gray-bg)'},
  prog:{color:'var(--blue)',bg:'var(--blue-bg)'},
  done:{color:'var(--green)',bg:'var(--green-bg)'},
};

// ═══════════════════════════════════════════
//  ÉTAT
// ═══════════════════════════════════════════
let state = loadState() || {
  members: [{id:'JU',name:'Julien',role:'Admin',paletteIdx:0}],
  tasks: [
    {id:1,title:'Configurer le repository',member:'JU',status:'todo',tag:'Admin',desc:'',done:[]},
    {id:2,title:'Rédiger le README',member:'JU',status:'prog',tag:'Dev',desc:'Expliquer comment installer et utiliser le dashboard.',done:['Structure du README définie']},
    {id:3,title:'Déployer sur GitHub Pages',member:'JU',status:'done',tag:'Dev',desc:'',done:['Repository créé','GitHub Pages activé']},
  ],
  events: [
    {id:1,time:'09:00',title:'Standup équipe',tag:'Réunion'},
    {id:2,time:'14:00',title:'Revue de code',tag:'Dev'},
  ],
  announces: [{author:'Julien',text:'Bienvenue ! Ajoutez vos collaborateurs via le bouton en haut.',time:"À l'instant"}],
  nextId:4, nextEventId:3,
};

let selectedTasks = new Set();
let currentTaskId = null;
let selectedPalette = 0;

// ═══════════════════════════════════════════
//  PERSISTENCE
// ═══════════════════════════════════════════
function saveState() { try { localStorage.setItem('td_v2', JSON.stringify(state)); } catch(e){} }
function loadState() { try { const s=localStorage.getItem('td_v2'); return s?JSON.parse(s):null; } catch(e){return null;} }

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
function pad(n){return String(n).padStart(2,'0');}
function initials(name){return name.trim().slice(0,2).toUpperCase();}
function getPalette(m){return PALETTES[m.paletteIdx%PALETTES.length];}
function memberById(id){return state.members.find(m=>m.id===id);}
function tagStyle(tag){const s=TAG_STYLES[tag]||TAG_STYLES['Autre'];return `background:${s.bg};color:${s.color}`;}
function genId(name){
  let base=(name.trim().slice(0,2).toUpperCase().replace(/[^A-Z]/g,'')||'XX'), id=base, i=2;
  while(state.members.some(m=>m.id===id)) id=base+(i++);
  return id;
}
function relTime(){
  const n=new Date();
  return n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

// ═══════════════════════════════════════════
//  SELECTS MEMBRES
// ═══════════════════════════════════════════
function renderMemberSelects(){
  ['new-task-member'].forEach(id=>{
    const el=document.getElementById(id); if(!el)return;
    const val=el.value;
    el.innerHTML=state.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
    if(state.members.some(m=>m.id===val)) el.value=val;
  });
}

// ═══════════════════════════════════════════
//  KANBAN
// ═══════════════════════════════════════════
function renderKanban(){
  ['todo','prog','done'].forEach(s=>{
    const col=document.getElementById('col-'+s);
    const cnt=document.getElementById('cnt-'+s);
    const filtered=state.tasks.filter(t=>t.status===s);
    cnt.textContent='('+filtered.length+')';
    col.innerHTML=filtered.map(t=>{
      const m=memberById(t.member);
      const p=m?getPalette(m):PALETTES[5];
      const name=m?m.name:t.member;
      const checked=selectedTasks.has(t.id);
      const sc=STATUS_COLORS[t.status];
      return `<div class="task-card" id="tc-${t.id}">
        <div class="task-card-top">
          <div class="task-check${checked?' checked':''}" onclick="toggleSelect(${t.id})"></div>
          <span class="task-card-title" onclick="openTaskModal(${t.id})">${t.title}</span>
          <button class="task-del" onclick="deleteSingleTask(${t.id})" title="Supprimer">×</button>
        </div>
        <div class="task-meta">
          <span class="avatar" style="background:${p.bg};color:${p.color}">${initials(name)}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="tag" style="${tagStyle(t.tag)}">${t.tag}</span>
            <button class="cycle-btn" onclick="cycleTask(${t.id})" title="Avancer le statut">→</button>
          </div>
        </div>
      </div>`;
    }).join('');
  });
  updateMetrics();
  updateBulkBar();
  saveState();
}

function toggleSelect(id){
  if(selectedTasks.has(id)) selectedTasks.delete(id);
  else selectedTasks.add(id);
  renderKanban();
}
function clearSelection(){selectedTasks.clear();renderKanban();}
function deleteSelected(){
  if(!selectedTasks.size) return;
  if(!confirm(`Supprimer ${selectedTasks.size} tâche(s) ?`)) return;
  state.tasks=state.tasks.filter(t=>!selectedTasks.has(t.id));
  selectedTasks.clear();
  renderKanban();
}
function deleteSingleTask(id){
  if(!confirm('Supprimer cette tâche ?')) return;
  state.tasks=state.tasks.filter(t=>t.id!==id);
  selectedTasks.delete(id);
  renderKanban();
}
function updateBulkBar(){
  const bar=document.getElementById('bulk-bar');
  const cnt=document.getElementById('sel-count');
  if(selectedTasks.size>0){
    bar.style.display='flex';
    cnt.textContent=selectedTasks.size+' sélectionnée(s)';
  } else {
    bar.style.display='none';
  }
}
function cycleTask(id){
  const t=state.tasks.find(x=>x.id===id); if(!t)return;
  t.status={todo:'prog',prog:'done',done:'todo'}[t.status];
  renderKanban();
}
function addTask(){
  const title=document.getElementById('new-task-title').value.trim();
  const member=document.getElementById('new-task-member').value;
  const tag=document.getElementById('new-task-tag').value;
  if(!title){document.getElementById('new-task-title').focus();return;}
  state.tasks.push({id:state.nextId++,title,member,status:'todo',tag,desc:'',done:[]});
  document.getElementById('new-task-title').value='';
  renderKanban();
}

// ═══════════════════════════════════════════
//  MODAL TÂCHE
// ═══════════════════════════════════════════
function openTaskModal(id){
  currentTaskId=id;
  const t=state.tasks.find(x=>x.id===id); if(!t)return;
  const m=memberById(t.member);
  const p=m?getPalette(m):PALETTES[5];
  const sc=STATUS_COLORS[t.status];

  document.getElementById('tm-title').textContent=t.title;
  document.getElementById('tm-status-badge').textContent=STATUS_LABELS[t.status];
  document.getElementById('tm-status-badge').style.cssText=`background:${sc.bg};color:${sc.color};`;
  document.getElementById('tm-avatar').textContent=m?initials(m.name):'?';
  document.getElementById('tm-avatar').style.cssText=`background:${p.bg};color:${p.color}`;
  document.getElementById('tm-member-name').textContent=m?m.name:'';
  document.getElementById('tm-tag').textContent=t.tag;
  document.getElementById('tm-tag').style.cssText=tagStyle(t.tag);
  document.getElementById('tm-desc').value=t.desc||'';
  renderDoneList(t);
  document.getElementById('task-modal-overlay').classList.add('open');
}
function renderDoneList(t){
  const ul=document.getElementById('tm-done-list');
  ul.innerHTML=(t.done||[]).map((d,i)=>
    `<li><span style="flex:1">${d}</span><button class="del-btn" onclick="removeDoneItem(${i})">×</button></li>`
  ).join('');
}
function addDoneItem(){
  const inp=document.getElementById('tm-done-input');
  const val=inp.value.trim(); if(!val)return;
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  if(!t.done) t.done=[];
  t.done.push(val);
  inp.value='';
  renderDoneList(t);
}
function removeDoneItem(idx){
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  t.done.splice(idx,1);
  renderDoneList(t);
}
function setTaskStatus(status){
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  t.status=status;
  const sc=STATUS_COLORS[status];
  document.getElementById('tm-status-badge').textContent=STATUS_LABELS[status];
  document.getElementById('tm-status-badge').style.cssText=`background:${sc.bg};color:${sc.color};`;
}
function saveTaskModal(){
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  t.desc=document.getElementById('tm-desc').value;
  renderKanban();
  closeTaskModal();
}
function deleteTaskFromModal(){
  if(!confirm('Supprimer cette tâche ?')) return;
  state.tasks=state.tasks.filter(t=>t.id!==currentTaskId);
  selectedTasks.delete(currentTaskId);
  renderKanban();
  closeTaskModal();
}
function closeTaskModal(){document.getElementById('task-modal-overlay').classList.remove('open');}
function closeTaskModalOnBg(e){if(e.target===document.getElementById('task-modal-overlay')) closeTaskModal();}

// ═══════════════════════════════════════════
//  MÉTRIQUES & KPIs
// ═══════════════════════════════════════════
function updateMetrics(){
  const done=state.tasks.filter(t=>t.status==='done').length;
  const prog=state.tasks.filter(t=>t.status==='prog').length;
  const pct=state.tasks.length?Math.round(done/state.tasks.length*100):0;
  document.getElementById('m-done').textContent=done;
  document.getElementById('m-prog').textContent=prog;
  document.getElementById('m-pct').textContent=pct+'%';
  const n=state.tasks.length||1;
  document.getElementById('kpi-list').innerHTML=[
    {label:'Terminées',val:done,max:n,color:'var(--green)'},
    {label:'En cours', val:prog,max:n,color:'var(--blue)'},
    {label:'À faire',  val:state.tasks.filter(t=>t.status==='todo').length,max:n,color:'var(--gray)'},
    {label:'Avancement',val:pct,max:100,color:'var(--purple)',suffix:'%'},
  ].map(k=>`<div class="kpi-row">
    <span class="kpi-label">${k.label}</span>
    <div class="kpi-bar-bg"><div class="kpi-bar" style="width:${Math.round(k.val/k.max*100)}%;background:${k.color}"></div></div>
    <span class="kpi-val">${k.val}${k.suffix||''}</span>
  </div>`).join('');
}

// ═══════════════════════════════════════════
//  AGENDA
// ═══════════════════════════════════════════
function renderAgenda(){
  const sorted=[...state.events].sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById('agenda-list').innerHTML=sorted.map(e=>`
    <div class="agenda-item">
      <span class="agenda-time">${e.time}</span>
      <div class="agenda-body">
        <div class="agenda-title">${e.title}</div>
        <div class="agenda-tags"><span class="tag" style="${tagStyle(e.tag)}">${e.tag}</span></div>
      </div>
      <button class="agenda-del" onclick="deleteEvent(${e.id})" title="Supprimer">×</button>
    </div>`).join('');
}
function addEvent(){
  const time=document.getElementById('new-event-time').value;
  const title=document.getElementById('new-event-title').value.trim();
  if(!title){document.getElementById('new-event-title').focus();return;}
  state.events.push({id:state.nextEventId++,time,title,tag:'Autre'});
  document.getElementById('new-event-title').value='';
  renderAgenda(); saveState();
}
function deleteEvent(id){
  state.events=state.events.filter(e=>e.id!==id);
  renderAgenda(); saveState();
}

// ═══════════════════════════════════════════
//  ANNONCES
// ═══════════════════════════════════════════
function renderAnnounces(){
  document.getElementById('announce-list').innerHTML=state.announces.map(a=>{
    const m=state.members.find(x=>x.name===a.author);
    const p=m?getPalette(m):PALETTES[0];
    return `<div class="msg">
      <div class="avatar" style="background:${p.bg};color:${p.color}">${a.author[0].toUpperCase()}</div>
      <div class="msg-body">
        <div class="msg-author">${a.author}</div>
        <div class="msg-text">${a.text}</div>
        <div class="msg-time">${a.time}</div>
      </div>
    </div>`;
  }).join('');
}
function postAnnounce(){
  const txt=document.getElementById('new-announce').value.trim(); if(!txt)return;
  const me=state.members[0];
  state.announces.unshift({author:me?me.name:'Moi',text:txt,time:relTime()});
  document.getElementById('new-announce').value='';
  renderAnnounces(); saveState();
}

// ═══════════════════════════════════════════
//  MODAL COLLABORATEURS
// ═══════════════════════════════════════════
function renderColorOpts(){
  document.getElementById('color-opts').innerHTML=PALETTES.map((p,i)=>
    `<div class="color-opt${i===selectedPalette?' selected':''}" style="background:${p.color}" onclick="selectPalette(${i})"></div>`
  ).join('');
}
function selectPalette(i){selectedPalette=i;renderColorOpts();}
function renderMemberList(){
  document.getElementById('member-list').innerHTML=state.members.map(m=>{
    const p=getPalette(m);
    return `<div class="member-row">
      <span class="avatar" style="background:${p.bg};color:${p.color}">${initials(m.name)}</span>
      <span>${m.name}</span>
      <span class="role">${m.role||''}</span>
      <button class="del-btn" onclick="deleteMember('${m.id}')" title="Supprimer">×</button>
    </div>`;
  }).join('');
}
function openMembersModal(){renderMemberList();renderColorOpts();document.getElementById('members-modal-overlay').classList.add('open');}
function closeMembersModal(){document.getElementById('members-modal-overlay').classList.remove('open');}
function closeMembersModalOnBg(e){if(e.target===document.getElementById('members-modal-overlay'))closeMembersModal();}
function addMember(){
  const name=document.getElementById('m-name').value.trim();
  const role=document.getElementById('m-role').value.trim();
  if(!name){document.getElementById('m-name').focus();return;}
  const id=genId(name);
  state.members.push({id,name,role,paletteIdx:selectedPalette});
  document.getElementById('m-name').value='';
  document.getElementById('m-role').value='';
  renderMemberList();renderMemberSelects();saveState();
}
function deleteMember(id){
  if(state.members.length<=1){alert('Il faut au moins un membre.');return;}
  if(!confirm('Supprimer ce collaborateur ?'))return;
  state.members=state.members.filter(m=>m.id!==id);
  renderMemberList();renderMemberSelects();renderKanban();saveState();
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.getElementById('today-date').textContent=
  new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

document.getElementById('new-task-title').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
document.getElementById('new-announce').addEventListener('keydown',e=>{if(e.key==='Enter')postAnnounce();});
document.getElementById('new-event-title').addEventListener('keydown',e=>{if(e.key==='Enter')addEvent();});
document.getElementById('m-name').addEventListener('keydown',e=>{if(e.key==='Enter')addMember();});
document.getElementById('tm-done-input').addEventListener('keydown',e=>{if(e.key==='Enter')addDoneItem();});

renderMemberSelects();
renderKanban();
renderAgenda();
renderAnnounces();
</script>
</body>
</html>
