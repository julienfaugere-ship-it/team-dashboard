<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHAMORIN — Dashboard équipe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Marque CHAMORIN ── */
      --orange:       #F4874B;
      --orange-light: #FEF0E8;
      --orange-dark:  #C9602A;
      --green:        #2E8B57;
      --green-light:  #E6F4ED;
      --green-dark:   #1E6040;

      /* ── Neutres ── */
      --bg:       #F7F7F5;
      --surface:  #FFFFFF;
      --surface2: #F2F1EE;
      --border:   rgba(0,0,0,0.10);
      --border2:  rgba(0,0,0,0.20);
      --text:     #1C1C1A;
      --text2:    #5A5956;
      --text3:    #9A9894;

      --radius-md: 8px;
      --radius-lg: 14px;
      --radius-xl: 20px;

      /* ── Statuts ── */
      --todo-color: #8A8880; --todo-bg: #F2F1EE;
      --prog-color: #F4874B; --prog-bg: #FEF0E8;
      --done-color: #2E8B57; --done-bg: #E6F4ED;
      --red:        #C0392B; --red-bg: #FCECEA;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181816; --surface: #222220; --surface2: #2A2A27;
        --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.18);
        --text: #EDEAE2; --text2: #9A9890; --text3: #656360;
        --orange-light: #3D2510; --orange-dark: #F4A274;
        --green-light:  #0E2E1E; --green-dark:  #5DBE8A;
        --todo-bg: #2A2A27; --todo-color: #9A9890;
        --prog-bg: #3D2510; --prog-color: #F4A274;
        --done-bg: #0E2E1E; --done-color: #5DBE8A;
        --red-bg:  #2E1010; --red: #E57373;
      }
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

    /* ══════════════ TOPBAR ══════════════ */
    .topbar-wrap {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; height: 60px; gap: 12px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--green) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.5px;
    }
    .brand-name { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: .02em; }
    .brand-name span { color: var(--orange); }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .date-label { font-size: 12px; color: var(--text3); }

    /* ══════════════ LAYOUT ══════════════ */
    .app { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    .grid3-metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
    .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    @media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }

    /* ══════════════ CARDS ══════════════ */
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.1rem 1.25rem; }

    .metric {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.25rem;
      display: flex; flex-direction: column; gap: 4px;
      position: relative; overflow: hidden;
    }
    .metric::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--orange), var(--green));
    }
    .metric .lbl { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
    .metric .val { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1.1; }

    .section-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }

    /* ══════════════ BUTTONS ══════════════ */
    button {
      background: var(--surface); border: 0.5px solid var(--border2);
      border-radius: var(--radius-md); color: var(--text);
      padding: 7px 14px; font-size: 13px; cursor: pointer;
      transition: background .15s, transform .1s; font-family: inherit;
    }
    button:hover { background: var(--surface2); }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--orange); border-color: transparent;
      color: #fff; font-weight: 600;
    }
    button.primary:hover { background: var(--orange-dark); }
    button.green {
      background: var(--green); border-color: transparent;
      color: #fff; font-weight: 600;
    }
    button.green:hover { background: var(--green-dark); }
    button.danger { background: var(--red-bg); border-color: transparent; color: var(--red); font-weight: 500; }
    button.ghost { background: transparent; border-color: var(--border2); color: var(--text2); }

    input, select, textarea {
      background: var(--surface2); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); color: var(--text);
      padding: 7px 11px; font-size: 13px; font-family: inherit;
      outline: none; transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--orange); }

    /* ══════════════ AVATAR ══════════════ */
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }

    /* ══════════════ TAG ══════════════ */
    .tag { font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 600; }

    /* ══════════════ KANBAN ══════════════ */
    .kanban { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    @media (max-width: 600px) { .kanban { grid-template-columns: 1fr; } }

    .kanban-col { background: var(--surface2); border-radius: var(--radius-md); padding: 12px; min-height: 120px; }
    .col-header { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
    .col-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .col-title-txt { font-size: 12px; font-weight: 600; color: var(--text2); flex: 1; }
    .col-count { font-size: 11px; color: var(--text3); background: var(--surface); border-radius: 20px; padding: 1px 7px; }

    .task-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px;
      transition: border-color .15s, box-shadow .15s; position: relative;
    }
    .task-card:hover { border-color: var(--orange); }
    .task-card-top { display: flex; align-items: flex-start; gap: 8px; }
    .task-check {
      width: 17px; height: 17px; border-radius: 5px;
      border: 1.5px solid var(--border2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px; background: var(--surface);
      transition: all .15s;
    }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked::after { content: '✓'; font-size: 10px; color: #fff; font-weight: 700; }
    .task-card-title { font-size: 13px; font-weight: 500; cursor: pointer; flex: 1; color: var(--text); line-height: 1.4; }
    .task-card-title:hover { color: var(--orange); }
    .task-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; padding-left: 25px; }
    .task-del { background: none; border: none; color: var(--text3); font-size: 16px; padding: 0 3px; cursor: pointer; opacity: 0; transition: opacity .15s; line-height: 1; }
    .task-card:hover .task-del { opacity: 1; }
    .task-del:hover { color: var(--red); background: none; transform: none; }
    .cycle-btn { font-size: 11px; padding: 2px 8px; border-radius: 20px; cursor: pointer; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text2); font-weight: 500; }
    .cycle-btn:hover { background: var(--orange-light); color: var(--orange-dark); border-color: var(--orange); }

    .add-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
    .add-row input { flex: 2; min-width: 120px; }
    .add-row select { flex: 1; min-width: 80px; }

    .bulk-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); flex-wrap: wrap; }

    /* ══════════════ AGENDA ══════════════ */
    .agenda-item { display: flex; gap: 12px; padding: 9px 0; border-bottom: 0.5px solid var(--border); align-items: flex-start; }
    .agenda-item:last-child { border-bottom: none; }
    .agenda-time { font-size: 12px; color: var(--text3); min-width: 40px; padding-top: 2px; font-weight: 500; }
    .agenda-body { flex: 1; }
    .agenda-title-txt { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
    .agenda-del { background: none; border: none; color: var(--text3); font-size: 16px; padding: 0 3px; cursor: pointer; opacity: 0; transition: opacity .15s; flex-shrink: 0; }
    .agenda-item:hover .agenda-del { opacity: 1; }
    .agenda-del:hover { color: var(--red); background: none; transform: none; }
    .agenda-add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .agenda-add input[type="time"] { width: 90px; }
    .agenda-add input[type="text"] { flex: 1; min-width: 100px; }

    /* ══════════════ KPI ══════════════ */
    .kpi-row { display: flex; align-items: center; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
    .kpi-row:last-child { border-bottom: none; }
    .kpi-label { font-size: 13px; min-width: 100px; color: var(--text2); }
    .kpi-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; margin: 0 10px; overflow: hidden; }
    .kpi-bar { height: 6px; border-radius: 3px; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .kpi-val { font-size: 13px; font-weight: 600; min-width: 36px; text-align: right; color: var(--text); }

    /* ══════════════ ANNONCES ══════════════ */
    .msg { display: flex; gap: 10px; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
    .msg:last-child { border-bottom: none; }
    .msg-body { flex: 1; min-width: 0; }
    .msg-author { font-size: 12px; font-weight: 600; color: var(--text); }
    .msg-text { font-size: 13px; color: var(--text2); margin-top: 2px; word-break: break-word; }
    .msg-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .announce-add { display: flex; gap: 8px; margin-top: 12px; }
    .announce-add input { flex: 1; }

    /* ══════════════ MODALS ══════════════ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s; padding: 1rem; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border-radius: var(--radius-xl); border: 0.5px solid var(--border); padding: 1.75rem; width: 500px; max-width: 100%; max-height: 90vh; overflow-y: auto; transform: translateY(14px); transition: transform .22s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 1.25rem; }
    .modal h2 { font-size: 17px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 20px; color: var(--text3); cursor: pointer; padding: 0; line-height: 1; }
    .modal-close:hover { color: var(--text); background: none; transform: none; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; font-weight: 500; color: var(--text2); display: block; margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; }
    .field textarea { resize: vertical; min-height: 80px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.5rem; flex-wrap: wrap; }

    /* Modal tâche */
    .status-badge { display: inline-flex; align-items: center; font-size: 12px; padding: 3px 11px; border-radius: 20px; font-weight: 600; }
    .task-detail-section { margin-top: 16px; }
    .task-detail-section h3 { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .done-list { list-style: none; }
    .done-list li { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; color: var(--text2); }
    .done-list li:last-child { border-bottom: none; }
    .done-check { color: var(--green); font-size: 12px; margin-top: 1px; flex-shrink: 0; font-weight: 700; }
    .done-add { display: flex; gap: 8px; margin-top: 10px; }
    .done-add input { flex: 1; }
    .status-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .status-btn { font-size: 12px; padding: 5px 14px; border-radius: 20px; font-weight: 500; }

    /* Membres modal */
    .member-list-modal { margin-bottom: 1rem; }
    .member-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
    .member-row:last-child { border-bottom: none; }
    .member-row .mname { flex: 1; font-size: 13px; font-weight: 500; }
    .member-row .role { font-size: 12px; color: var(--text3); }
    .del-btn { background: none; border: none; color: var(--text3); font-size: 17px; padding: 0 4px; cursor: pointer; line-height: 1; }
    .del-btn:hover { color: var(--red); background: none; transform: none; }

    .color-opts { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-opt { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: border-color .15s; }
    .color-opt.selected { border-color: var(--text); }
    .sep { border: none; border-top: 0.5px solid var(--border); margin: 1.1rem 0; }

    /* ══════════════ FOOTER ══════════════ */
    .app-footer { text-align: center; font-size: 11px; color: var(--text3); padding: 2rem 0 1rem; }
    .app-footer strong { color: var(--orange); }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar-wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">CH</div>
      <span class="brand-name">CHAMO<span>RIN</span></span>
    </div>
    <div class="topbar-right">
      <span class="date-label" id="today-date"></span>
      <button class="green" onclick="openMembersModal()">+ Collaborateurs</button>
    </div>
  </div>
</div>

<div class="app">

  <!-- Métriques -->
  <div class="grid3-metrics" style="margin-bottom:16px">
    <div class="metric"><div class="lbl">Tâches terminées</div><div class="val" id="m-done">0</div></div>
    <div class="metric"><div class="lbl">En cours</div><div class="val" id="m-prog">0</div></div>
    <div class="metric"><div class="lbl">Avancement</div><div class="val" id="m-pct">0%</div></div>
  </div>

  <!-- Kanban -->
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div class="section-title" style="margin-bottom:0">Tâches &amp; statuts</div>
      <div id="bulk-bar" style="display:none" class="bulk-bar">
        <span id="sel-count">0 sélectionnée(s)</span>
        <button class="danger" onclick="deleteSelected()">Supprimer la sélection</button>
        <button class="ghost" onclick="clearSelection()">Annuler</button>
      </div>
    </div>
    <div class="kanban">
      <div class="kanban-col">
        <div class="col-header">
          <span class="col-dot" style="background:var(--todo-color)"></span>
          <span class="col-title-txt">À faire</span>
          <span class="col-count" id="cnt-todo">0</span>
        </div>
        <div id="col-todo"></div>
      </div>
      <div class="kanban-col">
        <div class="col-header">
          <span class="col-dot" style="background:var(--orange)"></span>
          <span class="col-title-txt">En cours</span>
          <span class="col-count" id="cnt-prog">0</span>
        </div>
        <div id="col-prog"></div>
      </div>
      <div class="kanban-col">
        <div class="col-header">
          <span class="col-dot" style="background:var(--green)"></span>
          <span class="col-title-txt">Terminé</span>
          <span class="col-count" id="cnt-done">0</span>
        </div>
        <div id="col-done"></div>
      </div>
    </div>
    <div class="add-row">
      <input id="new-task-title" placeholder="Titre de la nouvelle tâche..." />
      <select id="new-task-member"></select>
      <select id="new-task-tag">
        <option>Dev</option><option>Design</option>
        <option>Marketing</option><option>Admin</option><option>Autre</option>
      </select>
      <button class="primary" onclick="addTask()">+ Ajouter</button>
    </div>
  </div>

  <!-- Agenda + KPIs + Annonces -->
  <div class="grid3">
    <div class="card">
      <div class="section-title">Agenda du jour</div>
      <div id="agenda-list"></div>
      <div class="agenda-add">
        <input type="time" id="new-event-time" value="09:00" />
        <input type="text" id="new-event-title" placeholder="Événement..." />
        <button class="primary" onclick="addEvent()">+</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">KPIs</div>
      <div id="kpi-list"></div>
    </div>
    <div class="card">
      <div class="section-title">Annonces</div>
      <div id="announce-list"></div>
      <div class="announce-add">
        <input id="new-announce" placeholder="Écrire une annonce..." />
        <button class="green" onclick="postAnnounce()">Publier</button>
      </div>
    </div>
  </div>

  <div class="app-footer">Dashboard collaboratif &mdash; <strong>CHAMORIN</strong></div>
</div>

<!-- ═══ Modal : Détail tâche ═══ -->
<div class="modal-overlay" id="task-modal-overlay" onclick="closeTaskModalOnBg(event)">
  <div class="modal">
    <div class="modal-header">
      <div style="flex:1">
        <h2 id="tm-title" style="word-break:break-word;margin-bottom:8px"></h2>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div id="tm-avatar" class="avatar"></div>
          <span id="tm-member-name" style="font-size:13px;color:var(--text2)"></span>
          <span id="tm-tag" class="tag"></span>
          <span id="tm-status-badge" class="status-badge"></span>
        </div>
      </div>
      <button class="modal-close" onclick="closeTaskModal()">×</button>
    </div>

    <div class="field">
      <label>Description — ce que je dois faire</label>
      <textarea id="tm-desc" placeholder="Décrivez les actions à accomplir..."></textarea>
    </div>

    <div class="task-detail-section">
      <h3>Ce qui a été réalisé</h3>
      <ul class="done-list" id="tm-done-list"></ul>
      <div class="done-add">
        <input id="tm-done-input" placeholder="Ajouter une réalisation..." />
        <button class="green" onclick="addDoneItem()">+</button>
      </div>
    </div>

    <div class="task-detail-section">
      <h3>Changer le statut</h3>
      <div class="status-btns">
        <button class="status-btn" style="background:var(--todo-bg);color:var(--todo-color);border:none" onclick="setTaskStatus('todo')">À faire</button>
        <button class="status-btn" style="background:var(--prog-bg);color:var(--prog-color);border:none" onclick="setTaskStatus('prog')">En cours</button>
        <button class="status-btn" style="background:var(--done-bg);color:var(--done-color);border:none" onclick="setTaskStatus('done')">Terminé</button>
      </div>
    </div>

    <div class="modal-footer">
      <button class="danger" onclick="deleteTaskFromModal()">Supprimer</button>
      <button class="ghost" onclick="closeTaskModal()">Annuler</button>
      <button class="primary" onclick="saveTaskModal()">Sauvegarder</button>
    </div>
  </div>
</div>

<!-- ═══ Modal : Collaborateurs ═══ -->
<div class="modal-overlay" id="members-modal-overlay" onclick="closeMembersModalOnBg(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>Collaborateurs</h2>
      <button class="modal-close" onclick="closeMembersModal()">×</button>
    </div>
    <div class="member-list-modal" id="member-list"></div>
    <hr class="sep"/>
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text2)">Ajouter un collaborateur</div>
    <div class="field"><label>Prénom</label><input id="m-name" placeholder="ex: Sophie" /></div>
    <div class="field"><label>Rôle</label><input id="m-role" placeholder="ex: Designer" /></div>
    <div class="field">
      <label>Couleur</label>
      <div class="color-opts" id="color-opts"></div>
    </div>
    <div class="modal-footer">
      <button class="ghost" onclick="closeMembersModal()">Fermer</button>
      <button class="primary" onclick="addMember()">Ajouter</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  PALETTES CHAMORIN
// ═══════════════════════════════════════════
const PALETTES = [
  {color:'#C9602A', bg:'#FEF0E8'}, // orange foncé
  {color:'#F4874B', bg:'#FDE8D8'}, // orange doux
  {color:'#1E6040', bg:'#E6F4ED'}, // vert foncé
  {color:'#2E8B57', bg:'#D6EFE2'}, // vert moyen
  {color:'#7A5C3A', bg:'#F5EDE3'}, // brun chaud
  {color:'#4A7C8A', bg:'#E3EFF2'}, // bleu ardoise
  {color:'#8A6A2E', bg:'#F5EDDA'}, // or
  {color:'#5A4E8A', bg:'#EDEAF5'}, // prune
];

const TAG_STYLES = {
  Dev:       {color:'#1E6040', bg:'#E6F4ED'},
  Design:    {color:'#C9602A', bg:'#FEF0E8'},
  Marketing: {color:'#F4874B', bg:'#FDE8D8'},
  Admin:     {color:'#7A5C3A', bg:'#F5EDE3'},
  Réunion:   {color:'#4A7C8A', bg:'#E3EFF2'},
  Autre:     {color:'#8A8880', bg:'#F2F1EE'},
};

const STATUS_LABELS = {todo:'À faire', prog:'En cours', done:'Terminé'};
const STATUS_STYLES = {
  todo:{color:'#8A8880', bg:'#F2F1EE'},
  prog:{color:'#C9602A', bg:'#FEF0E8'},
  done:{color:'#1E6040', bg:'#E6F4ED'},
};

// ═══════════════════════════════════════════
//  ÉTAT
// ═══════════════════════════════════════════
let state = loadState() || {
  members: [{id:'JU', name:'Julien', role:'Admin', paletteIdx:2}],
  tasks: [
    {id:1, title:'Configurer le repository', member:'JU', status:'todo', tag:'Admin', desc:'', done:[]},
    {id:2, title:'Rédiger le README', member:'JU', status:'prog', tag:'Dev', desc:'Expliquer comment installer et utiliser le dashboard.', done:['Structure du README définie']},
    {id:3, title:'Déployer sur GitHub Pages', member:'JU', status:'done', tag:'Dev', desc:'', done:['Repository créé','GitHub Pages activé']},
  ],
  events: [
    {id:1, time:'09:00', title:'Standup équipe', tag:'Réunion'},
    {id:2, time:'14:00', title:'Revue de code', tag:'Dev'},
  ],
  announces: [{author:'Julien', text:'Bienvenue sur le dashboard CHAMORIN ! Ajoutez vos collaborateurs via le bouton vert.', time:"À l'instant"}],
  nextId:4, nextEventId:3,
};

let selectedTasks = new Set();
let currentTaskId = null;
let selectedPalette = 0;

// ═══════════════════════════════════════════
//  PERSISTENCE
// ═══════════════════════════════════════════
function saveState(){ try{ localStorage.setItem('chamorin_v1', JSON.stringify(state)); }catch(e){} }
function loadState(){ try{ const s=localStorage.getItem('chamorin_v1'); return s?JSON.parse(s):null; }catch(e){return null;} }

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
function initials(n){ return n.trim().slice(0,2).toUpperCase(); }
function getPalette(m){ return PALETTES[m.paletteIdx % PALETTES.length]; }
function memberById(id){ return state.members.find(m=>m.id===id); }
function tagStyle(tag){ const s=TAG_STYLES[tag]||TAG_STYLES['Autre']; return `background:${s.bg};color:${s.color}`; }
function genId(name){
  let base=(name.trim().slice(0,2).toUpperCase().replace(/[^A-Z]/g,'')||'XX'), id=base, i=2;
  while(state.members.some(m=>m.id===id)) id=base+(i++);
  return id;
}

// ═══════════════════════════════════════════
//  SELECTS
// ═══════════════════════════════════════════
function renderMemberSelects(){
  const el=document.getElementById('new-task-member'); if(!el)return;
  const val=el.value;
  el.innerHTML=state.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  if(state.members.some(m=>m.id===val)) el.value=val;
}

// ═══════════════════════════════════════════
//  KANBAN
// ═══════════════════════════════════════════
function renderKanban(){
  ['todo','prog','done'].forEach(s=>{
    const col=document.getElementById('col-'+s);
    const cnt=document.getElementById('cnt-'+s);
    const filtered=state.tasks.filter(t=>t.status===s);
    cnt.textContent=filtered.length;
    col.innerHTML=filtered.map(t=>{
      const m=memberById(t.member);
      const p=m?getPalette(m):PALETTES[0];
      const name=m?m.name:t.member;
      const checked=selectedTasks.has(t.id);
      return `<div class="task-card" id="tc-${t.id}">
        <div class="task-card-top">
          <div class="task-check${checked?' checked':''}" onclick="toggleSelect(${t.id})"></div>
          <span class="task-card-title" onclick="openTaskModal(${t.id})">${t.title}</span>
          <button class="task-del" onclick="deleteSingleTask(${t.id})" title="Supprimer">×</button>
        </div>
        <div class="task-meta">
          <span class="avatar" style="background:${p.bg};color:${p.color}">${initials(name)}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="tag" style="${tagStyle(t.tag)}">${t.tag}</span>
            <button class="cycle-btn" onclick="cycleTask(${t.id})" title="Avancer">→</button>
          </div>
        </div>
      </div>`;
    }).join('');
  });
  updateMetrics();
  updateBulkBar();
  saveState();
}

function toggleSelect(id){ selectedTasks.has(id)?selectedTasks.delete(id):selectedTasks.add(id); renderKanban(); }
function clearSelection(){ selectedTasks.clear(); renderKanban(); }
function deleteSelected(){
  if(!selectedTasks.size)return;
  if(!confirm(`Supprimer ${selectedTasks.size} tâche(s) ?`))return;
  state.tasks=state.tasks.filter(t=>!selectedTasks.has(t.id));
  selectedTasks.clear(); renderKanban();
}
function deleteSingleTask(id){
  if(!confirm('Supprimer cette tâche ?'))return;
  state.tasks=state.tasks.filter(t=>t.id!==id);
  selectedTasks.delete(id); renderKanban();
}
function updateBulkBar(){
  const bar=document.getElementById('bulk-bar');
  const cnt=document.getElementById('sel-count');
  bar.style.display=selectedTasks.size>0?'flex':'none';
  cnt.textContent=selectedTasks.size+' sélectionnée(s)';
}
function cycleTask(id){
  const t=state.tasks.find(x=>x.id===id); if(!t)return;
  t.status={todo:'prog',prog:'done',done:'todo'}[t.status];
  renderKanban();
}
function addTask(){
  const title=document.getElementById('new-task-title').value.trim();
  const member=document.getElementById('new-task-member').value;
  const tag=document.getElementById('new-task-tag').value;
  if(!title){document.getElementById('new-task-title').focus();return;}
  state.tasks.push({id:state.nextId++,title,member,status:'todo',tag,desc:'',done:[]});
  document.getElementById('new-task-title').value='';
  renderKanban();
}

// ═══════════════════════════════════════════
//  MÉTRIQUES & KPIs
// ═══════════════════════════════════════════
function updateMetrics(){
  const done=state.tasks.filter(t=>t.status==='done').length;
  const prog=state.tasks.filter(t=>t.status==='prog').length;
  const pct=state.tasks.length?Math.round(done/state.tasks.length*100):0;
  document.getElementById('m-done').textContent=done;
  document.getElementById('m-prog').textContent=prog;
  document.getElementById('m-pct').textContent=pct+'%';
  const n=state.tasks.length||1;
  document.getElementById('kpi-list').innerHTML=[
    {label:'Terminées', val:done, max:n, color:'var(--green)'},
    {label:'En cours',  val:prog, max:n, color:'var(--orange)'},
    {label:'À faire',   val:state.tasks.filter(t=>t.status==='todo').length, max:n, color:'var(--text3)'},
    {label:'Avancement',val:pct,  max:100, color:'var(--green)', suffix:'%'},
  ].map(k=>`<div class="kpi-row">
    <span class="kpi-label">${k.label}</span>
    <div class="kpi-bar-bg"><div class="kpi-bar" style="width:${Math.round(k.val/k.max*100)}%;background:${k.color}"></div></div>
    <span class="kpi-val">${k.val}${k.suffix||''}</span>
  </div>`).join('');
}

// ═══════════════════════════════════════════
//  MODAL TÂCHE
// ═══════════════════════════════════════════
function openTaskModal(id){
  currentTaskId=id;
  const t=state.tasks.find(x=>x.id===id); if(!t)return;
  const m=memberById(t.member);
  const p=m?getPalette(m):PALETTES[0];
  const ss=STATUS_STYLES[t.status];
  document.getElementById('tm-title').textContent=t.title;
  document.getElementById('tm-status-badge').textContent=STATUS_LABELS[t.status];
  document.getElementById('tm-status-badge').style.cssText=`background:${ss.bg};color:${ss.color}`;
  document.getElementById('tm-avatar').textContent=m?initials(m.name):'?';
  document.getElementById('tm-avatar').style.cssText=`background:${p.bg};color:${p.color}`;
  document.getElementById('tm-member-name').textContent=m?m.name:'';
  document.getElementById('tm-tag').textContent=t.tag;
  document.getElementById('tm-tag').style.cssText=tagStyle(t.tag);
  document.getElementById('tm-desc').value=t.desc||'';
  renderDoneList(t);
  document.getElementById('task-modal-overlay').classList.add('open');
}
function renderDoneList(t){
  document.getElementById('tm-done-list').innerHTML=(t.done||[]).map((d,i)=>
    `<li><span class="done-check">✓</span><span style="flex:1">${d}</span><button class="del-btn" onclick="removeDoneItem(${i})">×</button></li>`
  ).join('');
}
function addDoneItem(){
  const inp=document.getElementById('tm-done-input');
  const val=inp.value.trim(); if(!val)return;
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  if(!t.done)t.done=[];
  t.done.push(val); inp.value=''; renderDoneList(t);
}
function removeDoneItem(idx){
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  t.done.splice(idx,1); renderDoneList(t);
}
function setTaskStatus(status){
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  t.status=status;
  const ss=STATUS_STYLES[status];
  document.getElementById('tm-status-badge').textContent=STATUS_LABELS[status];
  document.getElementById('tm-status-badge').style.cssText=`background:${ss.bg};color:${ss.color}`;
}
function saveTaskModal(){
  const t=state.tasks.find(x=>x.id===currentTaskId); if(!t)return;
  t.desc=document.getElementById('tm-desc').value;
  renderKanban(); closeTaskModal();
}
function deleteTaskFromModal(){
  if(!confirm('Supprimer cette tâche ?'))return;
  state.tasks=state.tasks.filter(t=>t.id!==currentTaskId);
  selectedTasks.delete(currentTaskId);
  renderKanban(); closeTaskModal();
}
function closeTaskModal(){ document.getElementById('task-modal-overlay').classList.remove('open'); }
function closeTaskModalOnBg(e){ if(e.target===document.getElementById('task-modal-overlay'))closeTaskModal(); }

// ═══════════════════════════════════════════
//  AGENDA
// ═══════════════════════════════════════════
function renderAgenda(){
  document.getElementById('agenda-list').innerHTML=[...state.events]
    .sort((a,b)=>a.time.localeCompare(b.time))
    .map(e=>`<div class="agenda-item">
      <span class="agenda-time">${e.time}</span>
      <div class="agenda-body">
        <div class="agenda-title-txt">${e.title}</div>
        <div style="margin-top:3px"><span class="tag" style="${tagStyle(e.tag)}">${e.tag}</span></div>
      </div>
      <button class="agenda-del" onclick="deleteEvent(${e.id})" title="Supprimer">×</button>
    </div>`).join('');
}
function addEvent(){
  const time=document.getElementById('new-event-time').value;
  const title=document.getElementById('new-event-title').value.trim();
  if(!title){document.getElementById('new-event-title').focus();return;}
  state.events.push({id:state.nextEventId++,time,title,tag:'Autre'});
  document.getElementById('new-event-title').value='';
  renderAgenda(); saveState();
}
function deleteEvent(id){
  state.events=state.events.filter(e=>e.id!==id);
  renderAgenda(); saveState();
}

// ═══════════════════════════════════════════
//  ANNONCES
// ═══════════════════════════════════════════
function renderAnnounces(){
  document.getElementById('announce-list').innerHTML=state.announces.map(a=>{
    const m=state.members.find(x=>x.name===a.author);
    const p=m?getPalette(m):PALETTES[0];
    return `<div class="msg">
      <div class="avatar" style="background:${p.bg};color:${p.color}">${a.author[0].toUpperCase()}</div>
      <div class="msg-body">
        <div class="msg-author">${a.author}</div>
        <div class="msg-text">${a.text}</div>
        <div class="msg-time">${a.time}</div>
      </div>
    </div>`;
  }).join('');
}
function postAnnounce(){
  const txt=document.getElementById('new-announce').value.trim(); if(!txt)return;
  const me=state.members[0];
  state.announces.unshift({author:me?me.name:'Moi',text:txt,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
  document.getElementById('new-announce').value='';
  renderAnnounces(); saveState();
}

// ═══════════════════════════════════════════
//  MODAL COLLABORATEURS
// ═══════════════════════════════════════════
function renderColorOpts(){
  document.getElementById('color-opts').innerHTML=PALETTES.map((p,i)=>
    `<div class="color-opt${i===selectedPalette?' selected':''}" style="background:${p.color}" onclick="selectPalette(${i})"></div>`
  ).join('');
}
function selectPalette(i){ selectedPalette=i; renderColorOpts(); }
function renderMemberList(){
  document.getElementById('member-list').innerHTML=state.members.map(m=>{
    const p=getPalette(m);
    return `<div class="member-row">
      <span class="avatar" style="background:${p.bg};color:${p.color}">${initials(m.name)}</span>
      <span class="mname">${m.name}</span>
      <span class="role">${m.role||''}</span>
      <button class="del-btn" onclick="deleteMember('${m.id}')" title="Supprimer">×</button>
    </div>`;
  }).join('');
}
function openMembersModal(){ renderMemberList(); renderColorOpts(); document.getElementById('members-modal-overlay').classList.add('open'); }
function closeMembersModal(){ document.getElementById('members-modal-overlay').classList.remove('open'); }
function closeMembersModalOnBg(e){ if(e.target===document.getElementById('members-modal-overlay'))closeMembersModal(); }
function addMember(){
  const name=document.getElementById('m-name').value.trim();
  const role=document.getElementById('m-role').value.trim();
  if(!name){document.getElementById('m-name').focus();return;}
  const id=genId(name);
  state.members.push({id,name,role,paletteIdx:selectedPalette});
  document.getElementById('m-name').value='';
  document.getElementById('m-role').value='';
  renderMemberList(); renderMemberSelects(); saveState();
}
function deleteMember(id){
  if(state.members.length<=1){alert('Il faut au moins un membre.');return;}
  if(!confirm('Supprimer ce collaborateur ?'))return;
  state.members=state.members.filter(m=>m.id!==id);
  renderMemberList(); renderMemberSelects(); renderKanban(); saveState();
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.getElementById('today-date').textContent =
  new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

document.getElementById('new-task-title').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
document.getElementById('new-announce').addEventListener('keydown',e=>{if(e.key==='Enter')postAnnounce();});
document.getElementById('new-event-title').addEventListener('keydown',e=>{if(e.key==='Enter')addEvent();});
document.getElementById('m-name').addEventListener('keydown',e=>{if(e.key==='Enter')addMember();});
document.getElementById('tm-done-input').addEventListener('keydown',e=>{if(e.key==='Enter')addDoneItem();});

renderMemberSelects();
renderKanban();
renderAgenda();
renderAnnounces();
</script>
</body>
</html>
